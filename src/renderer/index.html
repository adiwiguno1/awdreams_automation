<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIKS-NG Data Scraper & Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f4f5f7; }
    
    #top-bar {
      background: #1e293b;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #334155;
    }
    
    .btn {
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .btn-start { background: #10b981; color: white; }
    .btn-start:hover { background: #059669; }
    
    .btn-pause { background: #f59e0b; color: white; }
    .btn-pause:hover { background: #d97706; }
    
    .btn-stop { background: #ef4444; color: white; }
    .btn-stop:hover { background: #dc2626; }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #log-indicator {
      flex: 1;
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 4px;
      overflow-x: auto;
      white-space: nowrap;
    }

    #main-content {
      flex: 1;
      display: flex;
    }

    webview {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <div style="font-weight: bold; margin-right: 8px;">SIKS Scraper Control:</div>
    <button id="btn-start" class="btn btn-start">Start</button>
    <button id="btn-pause" class="btn btn-pause" disabled>Pause</button>
    <button id="btn-stop" class="btn btn-stop" disabled>Stop</button>
    <div id="log-indicator">Status: Ready. Silakan login di browser bawah.</div>
  </div>

  <div id="main-content">
    <webview id="siks-webview" src="https://siks.kemensos.go.id" allowpopups></webview>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
